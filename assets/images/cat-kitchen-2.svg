<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-k2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f2eb"/>
      <stop offset="100%" stop-color="#e6dfd3"/>
    </linearGradient>
    <linearGradient id="oak-k2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#bg-k2)"/>
  <!-- Modern Oak Kitchen Silhouette -->
  <rect x="50" y="60" width="400" height="90" rx="6" fill="#78350f"/>
  <line x1="180" y1="60" x2="180" y2="150" stroke="#92400e" stroke-width="2"/>
  <line x1="310" y1="60" x2="310" y2="150" stroke="#92400e" stroke-width="2"/>
  <!-- Marble Countertop -->
  <rect x="40" y="165" width="420" height="25" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Lower section green accent -->
  <rect x="50" y="190" width="400" height="120" rx="6" fill="url(#oak-k2)"/>
  <!-- Handleless minimalist grooves -->
  <line x1="60" y1="205" x2="440" y2="205" stroke="#22c55e" stroke-width="3" opacity="0.6"/>
  <line x1="180" y1="205" x2="180" y2="310" stroke="#14532d" stroke-width="3"/>
  <line x1="320" y1="205" x2="320" y2="310" stroke="#14532d" stroke-width="3"/>
</svg>