<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-w1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="100%" stop-color="#f0ebe1"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#bg-w1)"/>
  <!-- U-Shaped Wardrobe Silhouette -->
  <rect x="50" y="50" width="80" height="240" fill="#92400e" rx="4"/>
  <rect x="370" y="50" width="80" height="240" fill="#92400e" rx="4"/>
  <rect x="130" y="50" width="240" height="70" fill="#b45309" rx="4"/>
  <!-- Shelves and Hangers -->
  <line x1="60" y1="100" x2="120" y2="100" stroke="#fef3c7" stroke-width="3"/>
  <line x1="60" y1="150" x2="120" y2="150" stroke="#fef3c7" stroke-width="3"/>
  <line x1="60" y1="200" x2="120" y2="200" stroke="#fef3c7" stroke-width="3"/>
  <line x1="380" y1="100" x2="440" y2="100" stroke="#fef3c7" stroke-width="3"/>
  <line x1="380" y1="150" x2="440" y2="150" stroke="#fef3c7" stroke-width="3"/>
  <!-- Soft LED Backlight effect -->
  <rect x="140" y="140" width="220" height="130" rx="6" fill="#166534" opacity="0.15" stroke="#166534" stroke-width="2"/>
</svg>