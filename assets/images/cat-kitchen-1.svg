<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-k1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="100%" stop-color="#f0ebe1"/>
    </linearGradient>
    <linearGradient id="wood-k1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#bg-k1)"/>
  <!-- Classic Kitchen Cabinets -->
  <rect x="60" y="50" width="380" height="110" rx="4" fill="url(#wood-k1)"/>
  <!-- Cabinet door frames -->
  <rect x="75" y="65" width="100" height="80" rx="2" fill="none" stroke="#fef3c7" stroke-width="4"/>
  <rect x="200" y="65" width="100" height="80" rx="2" fill="none" stroke="#fef3c7" stroke-width="4"/>
  <rect x="325" y="65" width="100" height="80" rx="2" fill="none" stroke="#fef3c7" stroke-width="4"/>
  <!-- Countertop -->
  <rect x="40" y="180" width="420" height="20" rx="3" fill="#166534"/>
  <!-- Lower cabinets -->
  <rect x="50" y="200" width="400" height="110" rx="4" fill="#78350f"/>
  <rect x="70" y="215" width="115" height="80" fill="none" stroke="#fef3c7" stroke-width="3"/>
  <rect x="200" y="215" width="115" height="80" fill="none" stroke="#fef3c7" stroke-width="3"/>
  <rect x="330" y="215" width="100" height="80" fill="none" stroke="#fef3c7" stroke-width="3"/>
  <!-- Knobs -->
  <circle cx="160" cy="105" r="4" fill="#d97706"/>
  <circle cx="215" cy="105" r="4" fill="#d97706"/>
  <circle cx="385" cy="105" r="4" fill="#d97706"/>
</svg>